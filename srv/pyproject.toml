[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-cf-mcp-srv"
version = "0.1.0"
description = "SAP BTP Cloud Foundry Python MCP Server with Approuter & XSUAA Principal Propagation"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.8.0,<2.0.0",
    "fastapi>=0.115.0",
    "starlette>=0.41.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.9.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
sap = [
    "sap-xssec>=4.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
